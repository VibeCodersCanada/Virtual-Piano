<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Virtual Piano</title>

<style>
body{
margin:0;background:#0a0a0f;color:white;
font-family:monospace;display:flex;
flex-direction:column;align-items:center;
justify-content:center;min-height:100vh;gap:15px;
}

h1{color:#ffd166}

.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

.piano{display:flex;position:relative}

.white-key{
width:42px;height:160px;background:white;
border:1px solid #999;display:flex;
align-items:flex-end;justify-content:center;
font-size:10px;color:#333;cursor:pointer;
}

.white-key.active{background:#b0d0ff}

.black-key{
width:26px;height:100px;background:black;
position:absolute;color:#666;font-size:9px;
display:flex;justify-content:center;
align-items:flex-end;cursor:pointer;
}

.black-key.active{background:#334}
</style>
</head>

<body>

<h1>🎹 Virtual Piano</h1>

<div class="controls">
<select id="instrument">
<option value="piano">Piano</option>
<option value="synth">Synth</option>
<option value="organ">Organ</option>
<option value="bell">Bell</option>
</select>

<input id="volume" type="range" min="0" max="1" step="0.01" value="0.7">
</div>

<div class="piano" id="piano"></div>

<script>
const ctx = new (window.AudioContext||window.webkitAudioContext)();

// ✅ FIX 1: unlock audio properly
document.body.addEventListener("click",()=>{
  if(ctx.state==="suspended") ctx.resume();
},{once:false});

// ---------- AUDIO ROUTING ----------
const master = ctx.createGain();
master.connect(ctx.destination);

const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

function freq(note,oct){
  let i=NOTES.indexOf(note.replace(/\d/g,''));
  return 440*Math.pow(2,(i-9+(oct-4)*12)/12);
}

function play(note,oct){
  const now=ctx.currentTime;
  const f=freq(note,oct);
  const vol=parseFloat(volume.value);

  const g=ctx.createGain();
  g.gain.value=vol;
  g.connect(master);

  const osc=ctx.createOscillator();
  osc.frequency.value=f;

  const type=instrument.value;

  if(type==="synth") osc.type="sawtooth";
  else if(type==="organ") osc.type="sine";
  else osc.type="triangle";

  osc.connect(g);

  // envelope (IMPORTANT FIX)
  g.gain.setValueAtTime(vol,now);
  g.gain.exponentialRampToValueAtTime(0.001,now+1.5);

  osc.start(now);
  osc.stop(now+1.5);
}

// ---------- PIANO ----------
function build(){
  const piano=document.getElementById("piano");
  const keys=["C","D","E","F","G","A","B"];
  let x=0;

  keys.forEach(n=>{
    const k=document.createElement("div");
    k.className="white-key";
    k.textContent=n;

    k.onmousedown=()=>play(n,4);
    k.onmouseup=()=>k.classList.remove("active");

    piano.appendChild(k);
    x++;
  });
}

document.addEventListener("keydown",e=>{
  const map={a:"C",s:"D",d:"E",f:"F",g:"G",h:"A",j:"B"};
  if(map[e.key]) play(map[e.key],4);
});

build();
</script>

</body>
</html>
